# Mission parameters for dice_challenge.xml, read by
# dice_mission_from_config.launch.py. Edit and run:
#
#   ros2 launch drims_homework dice_mission_from_config.launch.py
#
# dice_mission.launch.py takes the same values as CLI arguments if you
# only want to override one for a single run.

# Face to leave facing up.
target_face: 6

# Where the die is put down, in camera_frame_floor (the play field, so
# these stay valid if the cell or the robot mounting changes). The plate
# centre is (0.365, 0.265); place_z is a base_link height and 0.012 is
# where the die's reported frame sits when it rests on the plate.
place_x: 0.365
place_y: 0.265
place_z: 0.012

# Relative lift before relocating the die, in metres.
lift_height: 0.035

# Grasp pose relative to dice_tf. Position "x;y;z" in metres: all zeros
# means grasp the die where vision reports it. Use it to correct a
# systematic bias in the detector, or to close a little off-centre.
grasp_offset: "0.0;0.0;0.0"

# Grasp orientation relative to dice_tf, "x;y;z;w". A zero quaternion means
# "derive it" -- the default, and what you want unless you have a reason.
#
# WARNING: this overrides BOTH grasps. The derived orientation is what keeps
# a finger off the face the camera must see and off the face that will rest
# on the table; a fixed quaternion cannot do that, because which faces are
# safe to pinch depends on the current and target face. Set it to diagnose
# or to force a specific approach, then put it back to zeros.
grasp_orientation: "0;0;0;0"

# Gripper positions in metres. grip_close does NOT have to be 0: closing
# fully makes the fingers interpenetrate the die's collision model, and on
# the real gripper it squeezes harder than needed. A 30mm die is held with
# grip_close a little under 0.030.
grip_close: 0.024
grip_open: 0.045

# Gripper effort. NOTE: the Robotiq adapter casts this to an int, so any
# value below 1.0 becomes 0 and the command is reported as failed even
# though the gripper moves. The tree ignores gripper failures for that
# reason, but keep this >= 1.0 unless you are deliberately testing it.
grip_effort: 1.0

# Approach tilt of the FIRST grasp (phase 1), about the gripper's closing
# axis. 0 is a vertical approach: it reaches the corners of the play area
# where the tilted one returns NO_IK_SOLUTION, and it is safe here because
# the fixed carry configuration decouples this grasp from the tip.
phase1_tilt: 0.0

# Approach tilt for the reorientation grasps (phase 2):
#   auto  -- geometry-derived sign, ~45deg, lets the placement bring the
#            die closer to the table than a vertical approach would;
#   0     -- vertical;
#   45 / -45 -- explicit override.
tilt_deg: auto

# Used ONLY when tilt_deg resolves to exactly 0: a vertical approach needs
# different clearances than the tilted one the base values are tuned for.
place_x_vertical: 0.365
place_y_vertical: 0.265
place_z_vertical: 0.012
lift_height_vertical: 0.035
